<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back soon – site upgrade in progress</title>
<style>
:root{
  --bg1:#2a2760;--bg2:#0f0e1d;
  --ink:#f3f2ff;--muted:#a9a7c9;
  --phosphor:#5dffa8;--amber:#ffc857;--red:#ff6b7a;
  --bezel:#2a2a3d;--bezel-edge:#454560;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.4rem;padding:2rem 1rem;text-align:center;color:var(--ink);overflow-x:hidden;
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(60rem 40rem at 50% -10%,var(--bg1),transparent 70%),
    radial-gradient(40rem 30rem at 85% 110%,#16423a55,transparent 70%),
    var(--bg2);
}
body::before{ /* faint grid that fades out */
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 70%);
          mask-image:radial-gradient(circle at 50% 40%,#000,transparent 70%);
}
header,main,footer{position:relative;z-index:1}
h1{font-size:clamp(1.7rem,6vw,2.9rem);line-height:1.1;margin:0 0 .5rem;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--muted);max-width:30rem;margin:0 auto;font-size:1rem;line-height:1.55}

/* ---------- setup ---------- */
.setup{display:flex;align-items:flex-end;justify-content:center;gap:18px;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.monitor{width:min(380px,90vw)}
.bezel{
  background:linear-gradient(160deg,#34344a,var(--bezel));
  border:3px solid var(--bezel-edge);border-radius:18px;padding:12px;
  box-shadow:0 0 0 1px #0008,0 18px 50px #0009,0 0 60px #5dffa822;
}
.screen{
  position:relative;height:250px;border-radius:8px;overflow:hidden;
  background:radial-gradient(120% 100% at 50% 0%,#0b2418,#030d08);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;color:var(--phosphor);
  text-shadow:0 0 6px #5dffa877;text-align:left;
  box-shadow:inset 0 0 40px #000c;
  animation:power .9s cubic-bezier(.2,.8,.2,1) .2s both;
}
@keyframes power{0%{transform:scaleY(.02);filter:brightness(4)}60%{transform:scaleY(1);filter:brightness(2)}100%{filter:none}}
.screen::before{ /* scanlines + vignette */
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(transparent 0 2px,#0000003a 2px 3px),radial-gradient(120% 120% at 50% 50%,transparent 60%,#000a);
}
.screen::after{ /* slow sweep */
  content:"";position:absolute;left:0;right:0;height:60px;top:-60px;z-index:2;pointer-events:none;
  background:linear-gradient(transparent,#5dffa814,transparent);animation:sweep 6s linear infinite;
}
@keyframes sweep{to{top:110%}}
.screen.flash{animation:flash .5s ease-out}
@keyframes flash{0%{filter:brightness(3) saturate(0)}100%{filter:none}}

#term{position:absolute;inset:0;padding:12px 12px 10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.line{white-space:pre-wrap;word-break:break-word;animation:in .18s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.dim{color:#5dffa8aa}
.ok{color:#8affc4}
.warn{color:var(--amber);text-shadow:0 0 6px #ffc85766}
.err{color:var(--red);text-shadow:0 0 6px #ff6b7a66}
.cursor{display:inline-block;width:.6em;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--phosphor);box-shadow:0 0 8px var(--phosphor);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.fill.broken{background:repeating-linear-gradient(45deg,var(--red) 0 12px,#c9404f 12px 24px);background-size:34px 34px;box-shadow:0 0 16px #ff6b7a77;animation:stripes 1s linear infinite,flick .3s steps(2) infinite}
@keyframes flick{50%{opacity:.65}}
.screen.broken{background:radial-gradient(120% 100% at 50% 0%,#2a0b10,#0d0305);color:var(--red);text-shadow:0 0 6px #ff6b7a77}
.screen.broken .cursor{background:var(--red);box-shadow:0 0 8px var(--red)}
.screen.glitch{animation:glitch .45s steps(2) 3}
@keyframes glitch{
  0%{transform:translate(0);filter:none}
  25%{transform:translate(-5px,2px) skewX(3deg);filter:hue-rotate(90deg) saturate(2.5)}
  50%{transform:translate(5px,-2px) skewX(-3deg);filter:hue-rotate(-70deg) contrast(1.4)}
  75%{transform:translate(-3px,-3px);filter:invert(.15)}
  100%{transform:none;filter:none}}
.wobble{animation:wobble .5s steps(2) 4}
@keyframes wobble{25%{transform:translateX(-3px) rotate(-.4deg)}75%{transform:translateX(3px) rotate(.4deg)}}
#pct.bad{color:var(--red);font-weight:700}

.stand{width:64px;height:16px;margin:0 auto;background:linear-gradient(#3a3a52,#2a2a3d)}
.base{width:140px;height:9px;margin:0 auto;background:#4b4b66;border-radius:5px;box-shadow:0 8px 14px #0008}

/* server rack */
.rack{width:70px;background:linear-gradient(160deg,#34344a,var(--bezel));border:3px solid var(--bezel-edge);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:7px;box-shadow:0 14px 34px #0009}
.gear{font-size:24px;line-height:1;text-align:center;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.unit{height:24px;background:#181824;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;gap:5px;padding:0 6px;box-shadow:inset 0 1px 3px #000a}
.led{width:7px;height:7px;border-radius:50%;background:var(--phosphor);box-shadow:0 0 6px var(--phosphor);animation:led 1.1s ease-in-out infinite}
.led.y{background:var(--amber);box-shadow:0 0 6px var(--amber);animation-duration:1.7s}
.led.r{background:var(--red);box-shadow:0 0 6px var(--red);animation-duration:.55s}
.led.d2{animation-delay:.3s}.led.d3{animation-delay:.6s}
@keyframes led{0%,100%{opacity:1}50%{opacity:.15}}

/* progress */
.progress{width:min(380px,90vw);margin:0 auto}
.track{height:16px;border-radius:99px;background:#1a1a2c;border:2px solid #3b3b58;overflow:hidden;box-shadow:inset 0 2px 6px #0008}
.fill{
  height:100%;width:100%;border-radius:99px;transform-origin:left center;transform:scaleX(.02);
  transition:transform 1.1s cubic-bezier(.22,.8,.24,1);
  background:repeating-linear-gradient(45deg,var(--phosphor) 0 12px,#2fcf7d 12px 24px);background-size:34px 34px;
  animation:stripes 1s linear infinite;box-shadow:0 0 14px #5dffa855;
}
.fill.stuck{background:repeating-linear-gradient(45deg,var(--amber) 0 12px,#e0a62f 12px 24px);background-size:34px 34px;box-shadow:0 0 14px #ffc85755}
@keyframes stripes{to{background-position:34px 0}}
.meta{display:flex;justify-content:space-between;margin-top:.55rem;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
#quip{color:var(--amber);font-weight:600;min-height:1.5em;margin:.9rem 0 0;transition:opacity .25s ease,transform .25s ease}
#quip.swap{opacity:0;transform:translateY(4px)}
footer p{margin:0;font-size:.85rem;color:#7f7da3}

@media (max-width:560px){
  .setup{flex-direction:column;align-items:center}
  .rack{width:auto;flex-direction:row;align-items:center;gap:10px}
  .unit{width:54px}
  .screen{height:230px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <h1>🛠️ We'll be right back</h1>
  <p class="sub">The site is getting an upgrade. Our developer promises it's "just a tiny change." (It never is.)</p>
</header>

<main>
  <div class="setup">
    <div class="monitor">
      <div class="bezel">
        <div class="screen" id="screen">
          <div id="term" aria-hidden="true"></div>
        </div>
      </div>
      <div class="stand"></div><div class="base"></div>
    </div>
    <div class="rack" aria-hidden="true">
      <span class="gear">⚙️</span>
      <div class="unit"><span class="led"></span><span class="led y d2"></span></div>
      <div class="unit"><span class="led y d3"></span><span class="led r"></span></div>
      <div class="unit"><span class="led d2"></span><span class="led d3"></span></div>
    </div>
  </div>

  <div class="progress" style="margin-top:1.6rem">
    <div class="track" role="progressbar" aria-label="Upgrade progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track">
      <div class="fill" id="fill"></div>
    </div>
    <div class="meta"><span id="pct">0%</span><span id="state">Status: optimistic</span></div>
  </div>
  <p id="quip" role="status" aria-live="polite">Booting up…</p>
</main>

<footer><p>Status 503 · Please check back soon. Thanks for your patience ☕</p></footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const screen = $('screen'), term = $('term'), bezel = document.querySelector('.bezel');
  const fill = $('fill'), pctEl = $('pct'), quip = $('quip'), track = $('track'), stateEl = $('state');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
  const MAX_LINES = 14;

  const cursor = document.createElement('span');
  cursor.className = 'cursor';

  /* ---------- terminal ---------- */
  function newLine(cls = '') {
    const line = document.createElement('div');
    line.className = 'line ' + cls;
    const txt = document.createElement('span');
    line.append(txt, cursor);
    term.append(line);
    while (term.children.length > MAX_LINES) term.firstChild.remove();
    return txt;
  }
  async function type(text, cls = '') {
    const txt = newLine(cls);
    if (reduce) { txt.textContent = text; return; }
    for (const ch of text) {
      txt.textContent += ch;
      await sleep(ch === ' ' ? 60 + Math.random() * 50 : 26 + Math.random() * 38);
    }
    await sleep(380);
  }
  async function out(text, cls = '', wait = 520) {
    newLine(cls).textContent = text;
    await sleep(wait);
  }

  /* ---------- progress + quips ---------- */
  let shown = 0, raf;
  function setProgress(v, stuck = false) {
    fill.style.transform = `scaleX(${Math.max(v, 2) / 100})`;
    fill.classList.toggle('stuck', stuck);
    if (v < 100) { fill.classList.remove('broken'); pctEl.classList.remove('bad'); }
    const from = shown, start = performance.now(), dur = reduce ? 0 : 1100;
    cancelAnimationFrame(raf);
    const tick = now => {
      const t = dur ? Math.min((now - start) / dur, 1) : 1;
      const e = 1 - Math.pow(1 - t, 3);
      shown = from + (v - from) * e;
      const n = Math.round(shown);
      pctEl.textContent = n + '%';
      track.setAttribute('aria-valuenow', n);
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  function status(t) { stateEl.textContent = 'Status: ' + t; }
  function say(text) {
    if (reduce) { quip.textContent = text; return; }
    quip.classList.add('swap');
    setTimeout(() => { quip.textContent = text; quip.classList.remove('swap'); }, 250);
  }

  /* ---------- the story ---------- */
  async function run() {
    for (;;) {
      term.textContent = ''; setProgress(2); shown = 0; say('Connecting to server…');
      await type('$ ssh admin@website');
      await out('Connecting… OK', 'ok');
      await out('Welcome back, developer.', 'dim');

      say('Running diagnostics…'); setProgress(14);
      await type('$ run diagnostics');
      await out('Scanning 4,212 files…', 'dim', 700);
      await out('warn: found 1 tiny change', 'warn');
      await out('err: tiny change is 3,000 lines', 'err');;

      say('Committing "small fix"…'); setProgress(32);
      await type('$ git commit -m "small fix"');
      await out('error: 47 merge conflicts', 'err');
      await out('Resolving conflicts by vibes…', 'dim', 800);

      say('Asking nicely for permissions…'); setProgress(51);
      await type('$ sudo make it work');
      await out('Permission granted.', 'ok');
      await out('Confidence level: low', 'warn');;

      say('Installing the internet…'); setProgress(70);
      await type('$ npm install');
      await out('added 1,847 packages', 'dim', 700);
      await out('and one existential doubt', 'dim');

      say('Deploying… almost there!'); setProgress(88);
      await type('$ deploy --prod');
      await out('Building…  ██████████░', 'dim', 900);
      await out('Building…  ███████████', 'ok', 700);

      say('Stuck at 99%. Classic.'); setProgress(99, true); status('hopeful');
      await out('Hanging at 99%…', 'warn', 1500);
      await out('Hanging at 99.9%…', 'warn', 1400);

      say('100%! We did it!!'); setProgress(100); status('flawless');
      await out('Deploy complete ✔', 'ok', 1300);
      await type('$ open website');
      await out('Loading…', 'dim', 900);
      await out('HTTP 200 OK', 'ok', 600);
      await out('Content: undefined', 'warn', 700);

      // everything falls apart
      screen.classList.remove('flash'); screen.classList.add('glitch');
      bezel.classList.add('wobble');
      await sleep(250);
      screen.classList.add('broken'); fill.classList.add('broken');
      pctEl.textContent = '100% broken'; pctEl.classList.add('bad'); status('on fire 🔥');
      say('100% done. 100% broken.');
      await out('Layout: on fire 🔥', 'err', 800);
      await out('Database: "what database?"', 'err', 900);
      await out('FATAL: task failed successfully', 'err', 1700);
      screen.classList.remove('glitch'); bezel.classList.remove('wobble');

      say('At MiWay, nothing works. Consistently.');
      await type('$ cat /etc/motd');
      await out('Welcome to MiWay.', 'dim', 700);
      await out('Where nothing works.', 'err', 900);
      await out('(but we are very consistent)', 'warn', 1500);

      say('It works on my machine…');
      await type('$ git blame');
      await out('blame: developer (5 minutes ago)', 'warn', 1200);
      await type('$ git blame --someone-else');
      await out('fatal: no one else exists', 'err', 1400);
      say('Reverting to the 2009 version…');
      await type('$ git revert HEAD');
      await out('Restoring last known good state…', 'dim', 1200);
      await out('Good news: it works', 'ok', 700);
      await out('Bad news: it\'s 2009', 'warn', 1500);
      await type('$ sudo reboot');
      await out('Rebooting… (this is the fix)', 'warn', 1000);

      screen.classList.remove('broken');
      screen.classList.remove('flash'); void screen.offsetWidth; screen.classList.add('flash');
      say('Turning it off and on again…'); status('optimistic');
      await sleep(1500);
      if (reduce) break;
    }
  }
  run();
})();
</script>
</body>
</html>
